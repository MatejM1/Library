<div class="card h-100 shadow-sm">
  <!-- Slika -->
  <img
    [src]="getImageUrl()"
    class="card-img-top"
    alt="{{ book.title }}"
    onerror="this.src='/assets/images/knjiga.jpg'"
  />

  <div class="card-header bg-primary text-white">
    <h5 class="card-title mb-0">{{ book.title }}</h5>
  </div>

  <div class="card-body">
    <h6 class="card-subtitle mb-2 text-muted">{{ book.author }}</h6>
    <p class="card-text">
      <span class="badge bg-secondary">{{ book.year }}</span>
    </p>
    <p class="card-text small">{{ book.description }}</p>
  </div>

  <div class="card-footer d-flex justify-content-between align-items-center">
    <div>
      <span class="badge bg-success me-2">{{ book.likes }}</span>
      <span class="badge bg-danger">{{ book.dislikes }}</span>
    </div>
    <a [routerLink]="['/books', book.id]" class="btn btn-sm btn-outline-primary">
      Podrobnosti
    </a>
  </div>
</div>
