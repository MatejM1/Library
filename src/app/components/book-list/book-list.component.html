<div class="container my-4">
  <!-- Naslov in števec -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Seznam knjig</h2>
    <span class="badge bg-primary fs-6">Zadetki: {{ filteredBooks.length }}</span>
  </div>

  <!-- Iskalnik -->
  <div class="row mb-3">
    <div class="col-md-6">
      <div class="input-group">
        <span class="input-group-text">Išči</span>
        <input
          type="text"
          class="form-control"
          placeholder="po naslovu ali avtorju..."
          [(ngModel)]="searchTerm"
          (input)="applyFilterAndSort()"
        />
      </div>
    </div>
    <div class="col-md-6 text-end">
      <a routerLink="/create" class="btn btn-primary" *ngIf="isLoggedIn()">
        Dodaj knjigo
      </a>
    </div>
  </div>

  <!-- Tabela -->
  <div class="table-responsive">
    <table class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th (click)="sort('id')" class="sortable id-column"># ⬍</th>
          <th (click)="sort('title')" class="sortable">Naslov ⬍</th>
          <th (click)="sort('author')" class="sortable">Avtor ⬍</th>
          <th (click)="sort('year')" class="sortable year-column">Leto ⬍</th>
          <th (click)="sort('likes')" class="sortable like-column">+ ⬍</th>
          <th (click)="sort('dislikes')" class="sortable like-column">- ⬍</th>
          <th class="actions-column">Dejanja</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let book of filteredBooks">
          <td>{{ book.id }}</td>
          <td>
            <strong>{{ book.title }}</strong>
            <span class="badge bg-warning text-dark ms-2" *ngIf="book.likes > 10">Priljubljena</span>
          </td>
          <td>{{ book.author }}</td>
          <td>{{ book.year }}</td>
          <td><span class="badge bg-success">{{ book.likes }}</span></td>
          <td><span class="badge bg-danger">{{ book.dislikes }}</span></td>
          <td>
            <div class="btn-group btn-group-sm">
              <a [routerLink]="['/books', book.id]" class="btn btn-outline-info">Podrobnosti</a>
              <a *ngIf="isLoggedIn()" [routerLink]="['/edit', book.id]" class="btn btn-outline-warning">Uredi</a>
              <button *ngIf="isLoggedIn()" class="btn btn-outline-danger" (click)="deleteBook(book.id)">Izbriši</button>
            </div>
          </td>
        </tr>
        <tr *ngIf="filteredBooks.length === 0">
          <td colspan="7" class="text-center text-muted py-4">
            Za vpisan kriterij ni zadetkov.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
